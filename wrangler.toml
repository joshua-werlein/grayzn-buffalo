name = "grayzn-buffalo"
compatibility_date = "2026-01-01"
account_id = "a79e3b4a2bb8dad70c75bceac4b1d3f9"
# Site Worker is intentionally unrouted pending the owner's cutover approval.
# The grayznbuffalo.com/* route is dashboard-managed: never add `routes`, `route`
# or custom domains here. Wrangler PUTs the Worker's full route list whenever
# routes are configured, which would delete the dashboard route.
workers_dev = false
preview_urls = false
upload_source_maps = false

# Private application diagnostics only; no routine request logs or traces.
# Cloudflare Workers Paid retains these logs for seven days, with account access.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true
destinations = []

[observability.traces]
enabled = false

[observability.issues]
enabled = false

[vars]
CF_ANALYTICS_ACCOUNT_ID = "a79e3b4a2bb8dad70c75bceac4b1d3f9"
CF_ANALYTICS_SITE_TAG = "55e9cf9f06fd4bffbb3ea50f6f1b0993"
# CF_ANALYTICS_API_TOKEN is a runtime secret, never committed here.

[[d1_databases]]
binding = "DB"
database_name = "grayzn-db"
database_id = "c998bfd4-7031-4ae2-9eea-df86f16ddb15"

[[kv_namespaces]]
binding = "SESSIONS"
id = "3c31559924b64014844778c431b80ef1"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "grayzn-photos"
