name: Deploy site Worker
on:
  push:
    branches: [main]
# Never let an older run finish after a newer one (or after a rollback commit).
concurrency:
  group: deploy-site-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Check Astro and TypeScript
        run: npx astro check
      - run: npm run build
      - name: Application regressions
        run: node --test --test-concurrency=4 tests/*.test.mjs
      - name: Facebook automation regressions (local and mocked)
        run: node --test --test-concurrency=4 workers/fb-feed/*.test.js
      - name: Check Worker secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Fails on a missing runtime secret or a [vars] name duplicated as a secret.
        # Explicit bash adds pipefail, so a Wrangler/API error also fails the step.
        shell: bash
        run: npx wrangler secret list --name grayzn-buffalo | node scripts/check-worker-secrets.mjs
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          # Editor-level Workers token: updates the owner-created grayzn-buffalo
          # Worker only. No route, zone or storage permissions; the site route
          # is dashboard-managed. The older Pages-only CLOUDFLARE_API_TOKEN
          # stays untouched for Pages rollback.
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Never publish dist/server as public Pages assets.
          # No routes or public preview are configured before cutover approval.
          command: deploy
